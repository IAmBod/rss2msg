log:
  level: info
  format: console

telemetry:
  service_name: rss2msg
  traces:
    enabled: true          # exported over OTLP to Alloy (OTEL_EXPORTER_OTLP_ENDPOINT)
  metrics:
    enabled: true          # exported over OTLP to Alloy

state:
  driver: sqlite
  sqlite:
    path: /tmp/rss2msg.db

sinks:
  - name: default
    driver: stdout
    stdout:
      format: json

feeds:
  - url: https://hnrss.org/frontpage
    interval: 1m
  - url: https://hnrss.org/newest
    interval: 1m
