# rss2msg publishing to RabbitMQ via the rabbitmq (AMQP 0-9-1) sink.
#
#   docker compose up
#
# A queue is pre-declared and bound to the exchange (see rabbitmq/definitions.json) so
# published messages are retained and visible in the management UI at
# http://localhost:15672 (guest / guest). Tear down with: docker compose down -v

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rss2msg:
    image: ${RSS2MSG_IMAGE:-ghcr.io/iambod/rss2msg:latest}
    command: ["serve"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config.yaml:/etc/rss2msg/config.yaml:ro
    tmpfs:
      - /tmp
    restart: unless-stopped
