# Comprehensive, runnable example configuration.
#
# Single-process setup (memory coordinator), local SQLite state, and an
# NDJSON stdout sink, wired to a large real-world set of feeds. Copy to
# config.yaml and adjust to taste:
#
#   cp examples/config.example.full.yaml config.yaml && ./rss2msg run-once
#
# For the minimal, fully annotated reference of every field, see
# examples/config.example.yaml and docs/reference/configuration.md.

log:
  level: info
  format: console

# Single-process feed ownership; no external coordination dependency.
coordination:
  driver: memory
  # Switch to redis for multi-instance deployments. Three topology modes:
  # redis:
  #   mode: single              # single (default) | sentinel | cluster
  #   lock_ttl: 30s             # optional, default 30s
  #   renewal_interval: 10s     # optional, default = lock_ttl / 3
  #
  #   # --- single mode (default) ---
  #   url: ${REDIS_URL}         # e.g. redis://localhost:6379/0 or rediss://...
  #
  #   # --- sentinel mode (tested / supported HA path) ---
  #   sentinel:
  #     master_name: mymaster
  #     addrs: [sentinel-a:26379, sentinel-b:26379, sentinel-c:26379]
  #     username: redisuser           # authenticates to the data nodes (master/replicas)
  #     password: ${REDIS_PASSWORD}   # authenticates to the data nodes (master/replicas)
  #     sentinel_username: sentuser           # authenticates to the sentinel nodes
  #     sentinel_password: ${SENTINEL_PASSWORD} # authenticates to the sentinel nodes
  #     db: 0
  #
  #   # --- cluster mode (best-effort; not covered by CI integration tests) ---
  #   cluster:
  #     addrs: [node-a:6379, node-b:6379, node-c:6379]
  #     username: redisuser
  #     password: ${REDIS_PASSWORD}
  #
  #   # --- shared TLS block (applies to all modes) ---
  #   # For single mode, requires rediss:// URL. For sentinel/cluster, set
  #   # server_name — there is no URL to derive the SNI hostname from, and
  #   # an empty server_name will fail cert verification against most certs.
  #   tls:
  #     ca_file: /etc/ssl/redis-ca.pem
  #     cert_file: /etc/ssl/redis-client.pem   # mTLS: both cert_file and key_file or neither
  #     key_file:  /etc/ssl/redis-client.key
  #     server_name: redis.internal             # SNI / cert-verify hostname override
  #     insecure_skip_verify: false             # true = disable cert verification (test only)
  #
  # Or use DynamoDB for multi-instance deployments on AWS. Leases are conditional
  # writes carrying an explicit lease_expiry; a peer may reclaim the lock only
  # after that expiry (no reliance on DynamoDB native TTL, which can lag ~48h).
  # dynamodb:
  #   table: rss2msg-coord-locks  # required; lock table with partition key "pk"
  #   region: us-east-1           # optional; SDK default chain when empty
  #   endpoint_url: ${AWS_ENDPOINT_URL}  # optional; LocalStack / VPC endpoint override
  #   lease_duration: 60s         # optional, default 60s. MUST safely exceed your
  #                               # worst-case per-feed poll time — if a poll outruns
  #                               # the lease, a peer can steal the lock mid-poll and
  #                               # both instances poll the same feed concurrently.
  #   # AWS credentials resolve via the default SDK chain (env, shared config,
  #   # IRSA / instance profile). The table must already exist (partition key
  #   # attribute named "pk", type S).

# Persist per-feed processing state to a local SQLite file.
state:
  driver: sqlite
  sqlite:
    path: ./rss2msg.db

sinks:
  # Emit each detected change as NDJSON to standard output.
  - name: default
    driver: stdout
    stdout:
      target: stdout
      format: json

