# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Generates CHANGELOG.md from Conventional Commits. Used both locally
# (`git cliff -o CHANGELOG.md`) and by the release workflow to build the
# notes attached to each GitHub release.

[changelog]
# Rendered with Tera templates (https://keats.github.io/tera/).
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated from [Conventional Commits](https://www.conventionalcommits.org)
by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
"""
trim = true

[git]
# Parse commits as Conventional Commits and group them below.
conventional_commits = true
filter_unconventional = true
split_commits = false
# Tidy up subjects before grouping.
commit_preprocessors = [
    # Replace issue numbers with links to the issue.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/IAmBod/rss2msg/issues/${1}))" },
]
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Testing" },
    { message = "^(build|ci)", group = "<!-- 6 -->Build & CI" },
    { message = "^chore\\(release\\):", skip = true },
    { message = "^chore\\(deps\\)", group = "<!-- 7 -->Dependencies" },
    { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
    { message = "^revert", group = "<!-- 9 -->Reverts" },
    { body = ".*security", group = "<!-- 1 -->Bug Fixes" },
    { message = ".*", group = "<!-- 8 -->Miscellaneous" },
]
# Drop merge commits — the PR-merge noise the repo accumulates on main.
filter_commits = false
protect_breaking_commits = true
skip_tags = "^v0\\.0\\."
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
