log:
  level: info
  format: json

telemetry:
  service_name: rss2msg
  traces:   { enabled: true }
  metrics:  { enabled: true }
  logs:     { enabled: false }
  prometheus:
    enabled: false
    listen: ":9090"

http:
  user_agent: "rss2msg/0.1 (+https://example.com)"
  timeout: 30s

retry:
  max_attempts: 3
  base_delay: 500ms
  max_delay: 10s

runtime:
  shutdown_drain_timeout: 30s
  run_once_concurrency: 8

coordination:
  driver: memory   # memory | postgres | redis ; default memory
  # postgres:
  #   dsn: ${POSTGRES_DSN}  # optional; falls back to state.postgres.dsn
  #   tls:                  # only takes effect when DSN does not set sslmode=disable
  #     ca_file: /etc/ssl/pg-ca.pem
  #     cert_file: /etc/ssl/pg-client.pem   # mTLS: both cert_file and key_file or neither
  #     key_file:  /etc/ssl/pg-client.key
  #     server_name: pg.internal             # SNI / cert-verify hostname override
  #     insecure_skip_verify: false          # true = disable cert verification (test only)
  # redis:
  #   url: ${REDIS_URL}      # e.g. redis://localhost:6379/0 or rediss://...
  #   lock_ttl: 30s          # optional, default 30s
  #   renewal_interval: 10s  # optional, default = lock_ttl / 3
  #   tls:                   # only with rediss://; defaults to system roots + SNI from URL
  #     ca_file: /etc/ssl/redis-ca.pem
  #     cert_file: /etc/ssl/redis-client.pem   # mTLS: both cert_file and key_file or neither
  #     key_file:  /etc/ssl/redis-client.key
  #     server_name: redis.internal             # SNI / cert-verify hostname override
  #     insecure_skip_verify: false             # true = disable cert verification (test only)

state:
  driver: sqlite   # postgres | sqlite
  sqlite:
    path: ./rss2msg.db    # filesystem path; ":memory:" and "?_pragma=..." are accepted
  # postgres:
  #   dsn: ${POSTGRES_DSN}
  #   tls:                  # only takes effect when DSN does not set sslmode=disable
  #     ca_file: /etc/ssl/pg-ca.pem
  #     cert_file: /etc/ssl/pg-client.pem   # mTLS: both cert_file and key_file or neither
  #     key_file:  /etc/ssl/pg-client.key
  #     server_name: pg.internal             # SNI / cert-verify hostname override
  #     insecure_skip_verify: false          # true = disable cert verification (test only)

sinks:
  - name: default
    driver: kafka
    kafka:
      brokers: ["kafka-1:9092"]
      topic: feed.changes
    dead_letter: dlq-main
  - name: pg-main
    driver: postgres
    postgres:
      dsn: ${POSTGRES_DSN}
      table: feed_changes
  - name: kafka-main
    driver: kafka
    kafka:
      brokers: ["kafka-1:9092", "kafka-2:9092"]
      topic: feed.changes
      acks: all
      compression: snappy
    dead_letter: dlq-main
  - name: dlq-main
    driver: postgres
    postgres:
      dsn: ${POSTGRES_DSN}
      table: feed_changes_dlq
  - name: sqs-main
    driver: sqs
    sqs:
      queue_url: https://sqs.us-east-1.amazonaws.com/123456789012/feed-changes
      region: us-east-1
      # endpoint_url: http://localhost:4566           # for LocalStack
      # message_group: feed_url                       # FIFO only: feed_url (default) | item_id | sink
    dead_letter: dlq-main
  - name: sns-main
    driver: sns
    sns:
      topic_arn: arn:aws:sns:us-east-1:123456789012:feed-changes
      region: us-east-1
      # message_group: feed_url                       # FIFO only: feed_url (default) | item_id | sink
    dead_letter: dlq-main
  - name: rmq-main
    driver: rabbitmq
    rabbitmq:
      url: amqp://guest:guest@rabbit-1:5672/      # or amqps:// for TLS
      exchange: feed.changes
      exchange_type: topic                        # direct (default) | topic | fanout | headers
      routing_key: feed.changes
      declare: true                               # declare the exchange at startup
      durable: true                               # only meaningful when declare=true
    dead_letter: dlq-main
  - name: stdout-debug
    driver: stdout
    stdout:
      target: stdout                              # stdout (default) | stderr
      format: json                                # json (default, NDJSON) | pretty (indented)

feeds:
  - url: https://example.com/blog/rss.xml
    interval: 5m
    sinks: [pg-main, kafka-main]
  - url: https://other.example/atom.xml
    interval: 15m
    http:
      timeout: 10s
      headers:
        Authorization: "Bearer ${OTHER_FEED_TOKEN}"
