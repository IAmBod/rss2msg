{{- if and (eq .Values.mode "deployment") .Values.metricsService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rss2msg.fullname" . }}-metrics
  labels:
    {{- include "rss2msg.labels" . | nindent 4 }}
  {{- with .Values.metricsService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.metricsService.type }}
  selector:
    {{- include "rss2msg.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metricsService.port }}
      targetPort: metrics
{{- end }}
