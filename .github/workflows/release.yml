name: Release

# Cut a release by pushing a semver tag:
#   git tag v1.2.3 && git push origin v1.2.3
#
# This builds multi-platform binaries + a multi-arch Docker image and publishes a
# GitHub Release whose notes come from git-cliff. CHANGELOG.md is regenerated and
# committed to main *before* tagging (by the cut-release skill / `/release` command),
# so the tagged commit already carries the populated changelog that GoReleaser bundles
# into the artifacts — this workflow neither regenerates nor syncs it.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff and GoReleaser need full history and tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # The cross-compile build cache is restored explicitly below. setup-go's
          # own cache only ever holds native linux/amd64 objects (that's all main CI
          # compiles), so it does nothing for the darwin / windows / arm64 targets
          # that dominate a release build.
          cache: false

      # Restore the Go module + build cache warmed on main by warm-build-cache.yml.
      # GitHub scopes caches by ref — a cache written by one tag push is NOT visible
      # to the next tag, only default-branch caches are — so the cross-compile object
      # cache has to be produced on main and restored here read-only. A miss (e.g.
      # right after a dependency bump, before the next nightly warm) just falls back
      # to a cold compile; trigger the "Warm release build cache" workflow manually
      # to pre-warm before a release if needed.
      - name: Restore Go build cache (warmed on main)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-gobuild-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            release-gobuild-${{ runner.os }}-

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Only the section for the tag being released, without the file header.
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # The tagged commit already carries the populated CHANGELOG.md (committed to
          # main before tagging), so the tree is clean and the validate pipe passes.
          # RELEASE_NOTES.md is git-ignored, so it doesn't dirty the tree.
          args: release --clean --release-notes RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushing the Homebrew formula to the separate IAmBod/homebrew-tap repo
          # needs a token with write access there; the default GITHUB_TOKEN is
          # scoped to this repo only. Set the TAP_GITHUB_TOKEN secret (a PAT with
          # contents:write on the tap repo). If it's unset, the brews step fails
          # but binaries/images/packages still publish — so the secret is only
          # required once you actually want the tap updated.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
