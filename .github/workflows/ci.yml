name: CI

# Fast feedback on every PR and on pushes to main: lint, unit tests, and a build
# of both the binary and the release config. The `integration` job additionally
# runs the testcontainers-backed suite behind `-tags=integration` (it needs
# Docker, which GitHub-hosted runners provide).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests (-race)
        run: go test -race ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    # testcontainers spins Postgres / Kafka / Redis / LocalStack etc.; image
    # pulls plus container startup dominate the wall-clock, so allow headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The testcontainers suite pulls a large, growing set of images (Postgres,
      # Kafka + Schema Registry, Redis, LocalStack, k3s, MSSQL, Azure, NATS,
      # RabbitMQ). Tests terminate their containers via t.Cleanup, but the pulled
      # images are left behind and accumulate until a stock ubuntu-latest runner
      # (~14 GB free on /) fills up and the job dies with "no space left on
      # device". Run package-by-package and reclaim Docker resources (stopped
      # containers + images) after each package so peak disk stays bounded.
      - name: integration tests (-tags=integration)
        run: |
          set -uo pipefail
          fail=0
          for pkg in $(go list -tags=integration ./...); do
            go test -race -tags=integration -timeout 25m "$pkg" || fail=1
            docker system prune --all --force >/dev/null 2>&1 || true
          done
          exit "$fail"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build binary
        run: go build ./cmd/rss2msg
      - name: validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  benchmarks:
    name: benchmark regression gate
    # Only on PRs: the gate compares the PR tree against its merge base, which
    # does not exist for a plain push. Skipped (not failed) on the first PR that
    # introduces a benchmark, since the base has no matching benchmark to diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base commit is available for `git worktree`.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260512194132-3cf34090a3db
      - name: compare benchmarks against base
        env:
          # Significance is handled by benchstat (it prints "~" within noise);
          # this is the extra magnitude guard on top, in percent.
          BENCH_THRESHOLD: "10"
          BENCH_COUNT: "6"
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          {
            echo '### Benchmark comparison (benchstat)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          bash scripts/bench-compare.sh "$base" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: helm lint
        run: helm lint deploy/helm/rss2msg
      - name: helm template (deployment)
        run: helm template rss2msg deploy/helm/rss2msg -f deploy/helm/rss2msg/ci/deployment-values.yaml
      - name: helm template (cronjob)
        run: helm template rss2msg deploy/helm/rss2msg -f deploy/helm/rss2msg/ci/cronjob-values.yaml
