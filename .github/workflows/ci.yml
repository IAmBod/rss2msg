name: CI

# Fast feedback on every PR and on pushes to main: lint, unit tests, and a build
# of both the binary and the release config. The `integration` job additionally
# runs the testcontainers-backed suite behind `-tags=integration` (it needs
# Docker, which GitHub-hosted runners provide).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests (-race)
        run: go test -race ./...

  integration:
    name: integration tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # The testcontainers suite pulls a large, growing set of images (Cosmos /
    # Service Bus emulators, Kafka + Schema Registry, gcloud-cli, LocalStack,
    # k3s, Postgres, Redis, NATS, RabbitMQ). Their combined footprint plus the
    # -race build cache overruns a single stock runner's ~14 GB free root disk,
    # so the job died with "no space left on device". Shard the integration
    # packages across runners by heavy-image ownership: each shard runs in
    # parallel on its own fresh disk and only pulls the images it needs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Cosmos DB emulator — heavy image, slow container startup.
          - name: cosmosdb
            packages: >-
              ./internal/coord/cosmosdb/...
              ./internal/sink/cosmosdb/...
              ./internal/state/cosmosdb/...
          # Service Bus emulator pulls its own SQL Edge backing container.
          - name: azure-servicebus
            packages: ./internal/sink/azureservicebus/...
          # Confluent Kafka + Schema Registry; e2e also exercises Kafka.
          - name: kafka
            packages: >-
              ./internal/sink/kafka/...
              ./test/e2e/...
          # LocalStack, shared by every AWS package (pulled once per runner).
          - name: aws
            packages: >-
              ./internal/coord/dynamodb/...
              ./internal/sink/dynamodb/...
              ./internal/state/dynamodb/...
              ./internal/sink/sns/...
              ./internal/sink/sqs/...
              ./internal/telemetry/...
          # gcloud-cli emulator (large) + k3s.
          - name: gcp-k8s
            packages: >-
              ./internal/sink/gcppubsub/...
              ./internal/feedsource/...
          # Lightweight Alpine-based images only.
          - name: light
            packages: >-
              ./internal/coord/postgres/...
              ./internal/sink/postgres/...
              ./internal/state/postgres/...
              ./internal/sink/feed/...
              ./internal/coord/redis/...
              ./internal/sink/nats/...
              ./internal/sink/amqp091/...
              ./internal/sink/rabbitmqstream/...
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: integration tests (-tags=integration)
        run: go test -race -tags=integration -timeout 25m ${{ matrix.shard.packages }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: build binary
        run: go build ./cmd/rss2msg
      - name: validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  benchmarks:
    name: benchmark regression gate
    # Only on PRs: the gate compares the PR tree against its merge base, which
    # does not exist for a plain push. Skipped (not failed) on the first PR that
    # introduces a benchmark, since the base has no matching benchmark to diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge-base commit is available for `git worktree`.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260512194132-3cf34090a3db
      - name: compare benchmarks against base
        env:
          # Significance is handled by benchstat (it prints "~" within noise);
          # this is the extra magnitude guard on top, in percent.
          BENCH_THRESHOLD: "10"
          BENCH_COUNT: "6"
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          {
            echo '### Benchmark comparison (benchstat)'
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rc=0
          bash scripts/bench-compare.sh "$base" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.0
      - name: helm lint
        run: helm lint deploy/helm/rss2msg
      - name: helm template (deployment)
        run: helm template rss2msg deploy/helm/rss2msg -f deploy/helm/rss2msg/ci/deployment-values.yaml
      - name: helm template (cronjob)
        run: helm template rss2msg deploy/helm/rss2msg -f deploy/helm/rss2msg/ci/cronjob-values.yaml
