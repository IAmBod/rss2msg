name: CI

# Fast feedback on every PR and on pushes to main: lint, unit tests, and a build
# of both the binary and the release config. Integration tests (testcontainers /
# Docker) are intentionally not run here — they live behind `-tags=integration`
# and are run on demand (see AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit tests (-race)
        run: go test -race ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build binary
        run: go build ./cmd/rss2msg
      - name: validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  helm:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.0
      - name: helm lint
        run: helm lint deploy/helm/rss2msg
      - name: helm template (deployment)
        run: helm template rss2msg deploy/helm/rss2msg -f deploy/helm/rss2msg/ci/deployment-values.yaml
      - name: helm template (cronjob)
        run: helm template rss2msg deploy/helm/rss2msg -f deploy/helm/rss2msg/ci/cronjob-values.yaml
