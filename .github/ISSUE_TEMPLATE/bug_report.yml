name: Bug report
description: Report something in rss2msg that isn't working as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please **do not** report
        security vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md)
        for the private reporting channel.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: When I run `rss2msg serve` with ... I expected ... but instead ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce. Include the command you ran.
      placeholder: |
        1. Config: `...`
        2. Run: `rss2msg ...`
        3. See error: `...`
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: >
        The relevant part of your config (YAML). **Redact all secrets**
        (passwords, tokens, DSNs, keys) before pasting.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. This is automatically formatted, so no backticks needed.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `rss2msg version`, or the commit SHA you built from.
      placeholder: v0.0.2 (or commit abc1234)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS / arch, and how you run it (binary, Docker image, Helm chart).
      placeholder: linux/amd64, Docker image
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I redacted any secrets from the config and logs above.
          required: true
