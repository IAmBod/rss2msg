name: Feature request
description: Suggest a new capability, sink, feed source, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        rss2msg is **config-first** — most behavior is driven by YAML rather than
        code. Where it makes sense, describe how the feature would look in config.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The use case or pain point, not just the proposed solution.
      placeholder: I want to publish changes to X, but there's no sink for it ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see. If it's config-driven, sketch the YAML.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds you've tried.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
