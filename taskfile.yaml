version: '3'

vars:
  GO: '{{.GO | default "go"}}'
  BIN: rss2msg
  IMAGE: '{{.IMAGE | default "rss2msg"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the rss2msg binary
    cmds:
      - '{{.GO}} build -o {{.BIN}} ./cmd/rss2msg'
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BIN}}'

  test:
    desc: Run unit tests (fast, no containers)
    cmds:
      - '{{.GO}} test -race ./...'

  test-integration:
    desc: Run integration tests (spins Postgres / Kafka / Redis / LocalStack via testcontainers; requires Docker)
    cmds:
      - '{{.GO}} test -race -tags=integration ./...'

  bench:
    desc: Run Go benchmarks for the hot paths (change detection, feed parsing, sink fan-out)
    cmds:
      - '{{.GO}} test -run=^$ -bench=. -benchmem ./...'

  vet:
    desc: Run go vet across all packages
    cmds:
      - '{{.GO}} vet ./...'

  tidy:
    desc: Run go mod tidy
    cmds:
      - '{{.GO}} mod tidy'

  proto:
    desc: 'Regenerate the gRPC sink stubs in proto/ from .proto files (requires buf; install: go install github.com/bufbuild/buf/cmd/buf@latest, google.golang.org/protobuf/cmd/protoc-gen-go@latest, google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest). Generated *.pb.go are committed, so this is only needed when a .proto changes.'
    cmds:
      - buf lint
      - buf generate

  clean:
    desc: Remove the built binary
    cmds:
      - rm -f {{.BIN}}

  lint:
    desc: Run golangci-lint (requires golangci-lint v2; `task vet` is the dependency-free alternative)
    cmds:
      - golangci-lint run ./...

  helm-lint:
    desc: Lint the Helm chart and render both ci/ value sets (requires helm v3)
    vars:
      CHART: deploy/helm/rss2msg
    cmds:
      - helm lint {{.CHART}}
      - helm template rss2msg {{.CHART}} -f {{.CHART}}/ci/deployment-values.yaml >/dev/null
      - helm template rss2msg {{.CHART}} -f {{.CHART}}/ci/cronjob-values.yaml >/dev/null

  changelog:
    desc: Regenerate CHANGELOG.md from conventional commits (requires git-cliff)
    cmds:
      - git cliff --config cliff.toml --output CHANGELOG.md

  release-check:
    desc: Validate the GoReleaser config without building (requires goreleaser)
    cmds:
      - goreleaser check

  release-snapshot:
    desc: Dry-run a release into ./dist without publishing (requires goreleaser + Docker)
    cmds:
      - goreleaser release --snapshot --clean

  docker-build:
    desc: Build the production image locally via GoReleaser (needs goreleaser + Docker; the production stage packages a prebuilt binary, so a plain docker build can't produce it)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  docker-build-dev:
    desc: Build the development container image with hot reload ({{.IMAGE}}:dev)
    cmds:
      - docker build --target development -t {{.IMAGE}}:dev .

  docker-up:
    desc: Run the dev stack (hot reload) via Docker Compose
    cmds:
      - docker compose up --build

  docker-down:
    desc: Stop and remove the Docker Compose dev stack
    cmds:
      - docker compose down
